				if (o.delay_time > 0) hapiDelayCount++;
				out.push(o);
			};
			((j && j.TS) || []).forEach(function (e)
			{
				var m = /^E(\d+)([UD])$/.exec(e.id || ""); if (!m) return;
				(e.tr || []).forEach(function (t) { add(t, m[2] == "U", { station_id: parseInt(m[1], 10), hapi_kind: "S", hapi_st: parseInt(m[1], 10) }); });
			});

			{
				var m = /^([UD])(\d+)$/.exec(e.id || ""); if (!m) return;
				(e.tr || []).forEach(function (t) { add(t, m[1] == "U", { section_id: m[1] + m[2], hapi_kind: "K", hapi_st: parseInt(m[2], 10) }); });
			});

		}

		function hapiLoadDia(no)

			hapiDia[no] = { loading: true, t: Date.now(), d: null };
			var f = encodeURIComponent(no) + ".json?" + Date.now();
			var get = function (base) { return fetch(base + f).then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); }); };
			get(HAPI_DIA_PROXY).catch(function () { return get(HAPI_DIA_URL); })
				.then(function (j) { hapiDia[no] = { t: Date.now(), d: (j && Array.isArray(j.dy)) ? j.dy : [] }; })

			if (!r) return "";
			if (kind == "K") return r.tt ? r.tt + "着" : (r.ht ? r.ht + "発" : "");

		// 診断用: えれサイトの全JSを読み、API名・JSON・編成関連の呼び出しを調べる
		function probeElesite()
		{
			var base = "/elesite-site";
			var KEY = /hensei|sharyo|unyou|unyo|formation|retsuban|sharyou/i;
			var getText = function (url) { return fetch(url).then(function (r) { return r.ok ? r.text() : ""; }).catch(function () { return ""; }); };
			var resolve = function (ref, from) { return ref.charAt(0) == "/" ? base + ref : new URL(ref, location.origin + from).pathname; };

			fetch(base + "/")
				.then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
				.then(function (html)
				{
					var mains = [];
					html.replace(/(?:src|href)="([^"]+\.js[^"]*)"/g, function (m, u) { if (mains.indexOf(u) < 0) mains.push(u); return m; });
					mains = mains.slice(0, 10).map(function (u) { return /^https?:/.test(u) ? u.replace(/^https?:\/\/www\.elesite-next\.com/, base) : (u.charAt(0) == "/" ? base + u : base + "/" + u); });
					var chunkSet = {}, texts = [];
					return Promise.all(mains.map(function (u)
					{
						return getText(u).then(function (js)
						{
							texts.push(js);
							js.replace(/["'`]((?:\.\/|\.\.\/)?[A-Za-z0-9_\-\.\/]+\.js)["'`]/g, function (m, ref) { chunkSet[resolve(ref, u)] = 1; return m; });
						});
					})).then(function ()
					{
						var list = Object.keys(chunkSet).filter(function (u) { return mains.indexOf(u) < 0; }).slice(0, 160);
						return Promise.all(list.map(function (u) { return getText(u).then(function (js) { texts.push(js); }); })).then(function () { return list.length; });
					}).then(function (nChunks)
					{
						var apis = {}, urls = {}, ctx = {}, jsons = {};
						texts.forEach(function (js)
						{
							(js.match(/get_[a-z0-9_]+/g) || []).forEach(function (n) { apis[n] = 1; });
							(js.match(/https?:\/\/[A-Za-z0-9._\-\/%?=&:]+/g) || []).forEach(function (u) { if (/elesite|amazonaws|json/i.test(u)) urls[u] = 1; });
							(js.match(/["'`][A-Za-z0-9_\-\/\.\$\{\}]+\.json["'`]/g) || []).forEach(function (u) { jsons[u] = 1; });
							js.replace(/(?:get_[a-z0-9_]*|fastapi\/[a-z0-9_]+)/g, function (m, off)
							{
								if (KEY.test(m) && !ctx[m]) ctx[m] = js.substr(Math.max(0, off - 30), 210).replace(/\s+/g, " ");
								return m;
							});
						});
						dbg("p2", "JS読込: メイン" + mains.length + "本 + 部品" + nChunks + "本 / 文字数計 " + texts.reduce(function (a, t) { return a + t.length; }, 0));
						dbg("p3", "API名(" + Object.keys(apis).length + "):\n" + Object.keys(apis).sort().join(" "));
						dbg("p4", "編成関連の呼び出し:\n" + (Object.keys(ctx).slice(0, 12).map(function (k) { return k + " ← " + ctx[k]; }).join("\n") || "なし"));
						dbg("p6", "URL/JSON:\n" + Object.keys(urls).concat(Object.keys(jsons)).slice(0, 40).join("\n"));
					});
				})
				.catch(function (e) { dbg("p1", "えれサイト取得失敗: " + e); });

		// えれサイトに編成情報が無いとき、東急車に限り 両数+編成番号 から編成名を推定する
		// 画像はファイル名に編成番号が入っており、存在しなければ読み込みに失敗して灰色に戻る
		function guessFormation(o, tlid)
		{
			if (!/急/.test(o.affiliation || "")) return "";
			var n = parseInt(o.train_orchestration_number, 10), c = parseInt(o.num_of_cars, 10);
			if (isNaN(n) || isNaN(c)) return "";
			var toyokoFamily = (tlid == 26001 || tlid == 26002 || tlid == 26009);
			if (!toyokoFamily) return "";
			var inRange = function (a, b) { return n >= a && n <= b; };
			if (c == 10 && (inRange(1, 22) || inRange(51, 79))) return (5100 + n) + "F";
			if (c == 8 && inRange(51, 79)) return (5100 + n) + "F";
			if (c == 8 && tlid != 26002 && inRange(1, 12)) return (4100 + n) + "F";
			if (c == 8 && tlid == 26002 && (inRange(1, 12) || inRange(21, 39))) return (3100 + n) + "F";
			return "";
		}

		function collectImgPaths(v, out, depth)
		{
			if (v == null || depth > 4) return;
			if (typeof v == "string")
			{
				if (!/\.(webp|png|jpe?g|gif|svg)(\?|$)/i.test(v) || /hatena\.(png|webp)$/i.test(v)) return;
				if (/^https?:/.test(v)) out.push(v);
				else if (v.indexOf("//") == 0) out.push("https:" + v);
				else
				{
					out.push("https://img.elesite-next.com" + (v.charAt(0) == "/" ? "" : "/") + v);
					if (!/^\/?rosen_icon\//.test(v)) out.push(ELESITE_IMG_BASE + v.replace(/^\//, ""));
				}
			}
			else if (Array.isArray(v)) v.forEach(function (x) { collectImgPaths(x, out, depth + 1); });
			else if (typeof v == "object") Object.keys(v).forEach(function (k) { collectImgPaths(v[k], out, depth + 1); });
		}

		function elesiteIconUrls(info)
		{
			var out = [];
			if (info.match)
			{
				collectImgPaths(info.match.sharyo_icon_path_list, out, 0);
				Object.keys(info.match).forEach(function (k)
				{
					if (k !== "sharyo_icon_path_list") collectImgPaths(info.match[k], out, 0);
				});
			}
			var toks = (info.formation || "").match(/[A-Za-z]?\d+(?:-\d+)?/g) || [];
			toks.forEach(function (tok)
			{
				var f = [tok];
				if (ELESITE_ICON_EXACT[f[0]]) out.push(encodeURI(ELESITE_IMG_BASE + ELESITE_ICON_EXACT[f[0]]));
				for (var j = 0; j < ELESITE_ICON_CLASSES.length; ++j)
				{
					var e = ELESITE_ICON_CLASSES[j];
					if (!e.formation.test(f[0])) continue;
					var cs = e.c.slice();
					var pf = LINE_FOLDER[info.line];
					if (pf && cs.every(function (x) { return x.cls == cs[0].cls; })) cs.sort(function (p, q) { return (q.folder == pf) - (p.folder == pf); });
					cs.forEach(function (x) { out.push(encodeURI(ELESITE_IMG_BASE + x.folder + "/" + x.cls + f[0] + ".webp")); });
					if (e.rep) cs.forEach(function (x) { out.push(encodeURI(ELESITE_IMG_BASE + x.folder + "/" + x.cls + e.rep + ".webp")); });
					break;
				}
			});
			return out.filter(function (u, i) { return out.indexOf(u) === i; });
		}

		const USE_ELESITE_ICONS = true;
		function setTrainIcon(el, info)
		{
			var urls = [];
			for (var i = 0; i < TRAIN_ICON_RULES.length; ++i)
			{
				var r = TRAIN_ICON_RULES[i];
				if (r.formation && !r.formation.test(info.formation || "")) continue;
				if (r.affiliation && !r.affiliation.test(info.affiliation || "")) continue;
				if (r.line != null && r.line != info.line) continue;
				if (r.cars != null && r.cars != info.cars) continue;
				urls.push(r.url);
				break;
			}
			if (urls.length == 0 && USE_ELESITE_ICONS)
			{
				urls = elesiteIconUrls(info);
				// 直接読めない場合に備え、同一オリジンのプロキシ経由の候補を後ろに足す
				if (/^https?:/.test(location.protocol))
				{
					var viaProxy = urls.filter(function (u) { return u.indexOf("https://img.elesite-next.com/") == 0; })
						.map(function (u) { return "/elesite-img/" + u.substr("https://img.elesite-next.com/".length); });
					urls = urls.concat(viaProxy);
				}
			}
			if (urls.length == 0 && TRAIN_ICON_LINE_DEFAULT[info.line]) urls.push(TRAIN_ICON_LINE_DEFAULT[info.line]);
			if (urls.length == 0 && TRAIN_ICON_DEFAULT) urls.push(TRAIN_ICON_DEFAULT);
			if (urls.length == 0) { dbg("nourl:" + (info.formation || "-"), "画像候補なし 形式='" + (info.formation || "") + "' match=" + (info.match ? "あり" : "なし")); el.innerHTML = TRAIN_ICON_SVG; return; }

			var existingImg = el.querySelector("img");
			if (existingImg && existingImg.getAttribute("data-src-applied") === urls[0]) {
				return;
			}

			var img = document.createElement("img");
			var idx = 0;
			img.referrerPolicy = "no-referrer";
			img.loading = "eager";
			img.alt = "";
			img.setAttribute("data-src-applied", urls[0]);
			img.onload = function () { dbg("img:" + img.src, "画像OK " + decodeURI(img.src)); };
			img.onerror = function () {
				dbg("img:" + img.src, "画像NG " + decodeURI(img.src));
				if (++idx < urls.length) {
					img.src = urls[idx];
					img.setAttribute("data-src-applied", urls[idx]);
				} else {
					el.innerHTML = TRAIN_ICON_SVG;
				}
			};
			img.src = urls[0];
			el.innerHTML = "";
			el.appendChild(img);
		}

		// キャッシュ管理
		const elesiteDataCache = {};

		// 同一オリジンのプロキシ(/elesite-api/)を先に試し、だめなら直接取得
		function fetchElesite(query)
		{
			dbg("query", "要求: " + query);
			var direct = function ()
			{
				return fetch("https://www.elesite-next.com/fastapi/" + query).then(function (r)
				{
					dbg("fetch", "えれ取得(直接): HTTP " + r.status);
					if (!r.ok) throw new Error("HTTP " + r.status);
					return r.json();
				});
			};
			if (!/^https?:/.test(location.protocol)) return direct();
			return fetch("/elesite-api/" + query)
				.then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
				.then(function (d) { dbg("fetch", "えれ取得(プロキシ): 成功"); return d; })
				.catch(function (e) { dbg("fetch-proxy", "プロキシ失敗: " + e + " → 直接取得に切替"); return direct(); });
		}

		var dayIdCache = {};
		function findDayId(o, d)
		{
			if (o == null || d > 5) return null;
			if (typeof o == "object")
			{
				if (o.day_id != null && o.day_id !== "") return o.day_id;
				for (var k in o) { var r = findDayId(o[k], d + 1); if (r != null) return r; }
			}
			return null;
		}
		// 今日のダイヤ区分(day_id)を取得。失敗したら固定値にフォールバック
		function getDayId(params, dateStr)
		{
			var key = params.rosen_code + ":" + dateStr;
			if (dayIdCache[key] != null) return Promise.resolve(dayIdCache[key]);
			return fetchElesite("get_today_dia_pattern?rosen_code=" + params.rosen_code + "&select_date=" + dateStr)
				.then(function (j)
				{
					var id = findDayId(j, 0);
					dbg("dia", "day_id: 取得=" + id + " (固定値 " + params.day_id + ")  応答 " + JSON.stringify(j).slice(0, 160));
					if (id == null) return params.day_id;
					dayIdCache[key] = id;
					return id;
				})
				.catch(function (e) { dbg("dia", "day_id取得失敗 → 固定値 " + params.day_id + " (" + e + ")"); return params.day_id; });
		}

		function elesiteKey(p) { return p.rosen_code + ":" + p.route_id; }

		function elesiteNum(v)
		{
			var m = String(v).match(/\d+/);
			return m ? parseInt(m[0], 10) : null;
		}

		function getElesiteCachedInfo(cacheKey, opNumber)
		{
			if (!cacheKey || opNumber == null || opNumber === "") return null;
			var cache = elesiteDataCache[cacheKey];
			if (!cache) return null;
			var n = elesiteNum(opNumber);
			return n == null ? null : (cache[n] || null);
		}

		function setElesiteCacheFromData(cacheKey, data)
		{
			if (!elesiteDataCache[cacheKey]) elesiteDataCache[cacheKey] = {};
			if (data && Array.isArray(data.train_position))
			{
				data.train_position.forEach(function (ep)
				{
					if (ep.unban == null) return;
					var n = elesiteNum(ep.unban);
					if (n == null) return;
					elesiteDataCache[cacheKey][n] = {
						sharyo_list: ep.sharyo_list || "",
						shotei: ep.shotei || "",
						background_color: ep.background_color || "#2F6FEA",
						text_color: ep.text_color || "#ffffff",
						shubetsu: ep.shubetsu || "",
						ikisaki: ep.ikisaki || "",
						sharyo_icon_path_list: ep.sharyo_icon_path_list || [],
						match: ep
					};
				});
			}
		}

		function opno(no, line)
		{
			if (line == 26005 || line == 26006)
				return ("00" + no).slice(-2);
			if (typeof no != "number")
				return no;
			if (no == 999)
				return no;
			if (line == null || line == 26001 || line == 26002 || line == 26009)
				if ((no / 100 | 0) in opchar)
					return ("00" + no).slice(-2) + opchar[no / 100 | 0];
			if (line == 26003 && no < 100)
				return ("00" + no).slice(-2) + (no < 50 ? "K" : no % 2 == 0 ? "T" : "S");
			return ("00" + no).slice(no < 10 ? -1 : no < 100 ? -2 : -3);
		}

		function isExtraTrain(o) {
			if (isHapiLine()) return false;
			if (!o || o.operation_number == null || o.operation_number === "") return false;
			var num = parseInt(o.operation_number, 10);
			if (isNaN(num)) return false;
			var isTensDigitNine = (Math.floor(num / 10) % 10 === 9);
			var isOutofService = (o.kind === "回" || o.train_kind == 6 || o.train_kind === "回6");
			return isTensDigitNine && isOutofService;
		}

		function fetchDelayInfo() {
			var delayText = document.getElementById("unten-text");
			if (!delayText) return;
			if (isHapiLine())
			{
				var getU = function (u) { return fetch(u + "?" + Date.now()).then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); }); };
				getU(hapiUseDirect ? HAPI_UNKOU_URL : HAPI_UNKOU_PROXY)
					.catch(function () { return getU(HAPI_UNKOU_URL); })
					.then(function (j) { hapiUnkou = j; hapiRenderUnten(); })
					.catch(function () { delayText.textContent = "運行情報の取得に失敗しました。"; });
				return;
			}

			var url = "https://8ye30pzjoj.execute-api.ap-northeast-1.amazonaws.com/production?_=" + Date.now();

			fetch(url)
				.then(response => {
					if (!response.ok) throw new Error("Network response was not ok");
					return response.json();
				})
				.then(data => {
					var lineMap = {
						"toyoko":       { key: "unten_ty", name: "東横線" },

						"oimachi":      { key: "unten_om", name: "大井町線" },
						"kodomo":       { key: "unten_kd", name: "こどもの国線" }
					};

					var statusText = (targetLine && data[targetLine.key]) ? data[targetLine.key] : (data.unten || "平常通り運転しています。");
					delayText.textContent = statusText;

					delayText.textContent = "運行情報の取得に失敗しました。";

		var request = null;
		function update()
		{
			if (request != null)
				return;

			if (!linedata[curline]) return;

			request = new XMLHttpRequest();
			var hapi = isHapiLine();
			var reqUrl = hapi ? ((hapiUseDirect ? HAPI_URL : HAPI_PROXY) + "?" + Date.now()) : "https://w-tid.jp/tokyu/" + linedata[curline].uri + ".json";
			request.open("GET", reqUrl, true);
			request.onreadystatechange = function ()
			{
				if (request.readyState != 4) return;
				if (request.status != 200) {
					if (hapi) dbg("hapi" + (hapiUseDirect ? "-直接" : "-プロキシ"), "ハピライン取得失敗: HTTP " + request.status + " " + reqUrl + (hapiUseDirect ? "" : "\n→ 直接取得に切替(CORS等で失敗する場合あり)"));
					request = null;
					if (hapi && !hapiUseDirect) { hapiUseDirect = true; update(); }
					return;
				}
				
				var res;
				try {
					res = JSON.parse(request.responseText);
				} catch(e) {
					if (hapi) dbg("hapi" + (hapiUseDirect ? "-直接" : "-プロキシ"), "ハピライン: JSONとして読めません " + reqUrl + "\n先頭: " + String(request.responseText).slice(0, 80));
					request = null;
					if (hapi && !hapiUseDirect) { hapiUseDirect = true; update(); }
					return;
				}
				if (hapi)
				{
					dbg("hapi", "ハピライン取得: " + reqUrl + "\nキー: " + Object.keys(res || {}).join(",") + (res && (res.TS || res.EK) ? "" : "\n⚠ TS/EK が無い＝列車位置のJSONではありません(HAPI_URL を確認)"));
					res = hapiConvert(res); hapiRenderUnten(); hapiRefreshDrawer(res.trains);
				}

				var renderTrainsInner = function() {
					var extraTrainsList = [];

					var boxes = document.querySelectorAll("#main .hl, #main .hr");

						while (boxes[bi].lastChild) boxes[bi].removeChild(boxes[bi].lastChild);

					if (res && Array.isArray(res.trains)) {
						res.trains.forEach(function (o)
						{
							if (o.line_id != linedata[curline].line_id)
								return;

							var tlid = ("train_line_id" in o ? o.train_line_id : linedata[curline].line_id);
							var hasOp = ("operation_number" in o && o.operation_number != null && o.operation_number !== "");
							var opTxt = hasOp ? String(opno(o.operation_number, tlid)) : "";
							if (isExtraTrain(o)) extraTrainsList.push(opTxt);

							var tra = document.createElement("div");
							tra.className = "train card " + (o.up ? "u" : "d") + " line" + tlid;
							if (o.hapi_no) { tra.setAttribute("data-hno", o.hapi_no); tra.setAttribute("data-hkind", o.hapi_kind); tra.setAttribute("data-hst", o.hapi_st); }
							var plain = function (h) { var t = document.createElement("div"); t.innerHTML = h; return t.textContent; };

							var kindHtml = "";
							if ("kind" in o && o.kind != "") kindHtml += o.kind;
							if ("train_kind" in o && o.train_kind != "") kindHtml += o.train_kind;
							var kindTxt = plain(kindHtml);
							var destHtml = "";
							if ("destination_station_code" in o)
							{
								var dmap = isHapiLine() ? destination_name_hapi : ((linedata[curline].line_id == 26001 || linedata[curline].line_id == 26002 || linedata[curline].line_id == 26009) ? destination_name_tymg : destination_name_dtom);
								var dc = o.destination_station_code;
								destHtml = dc in dmap ? dmap[dc] : String(dc);
							}
							var destTxt = plain(destHtml);
							var kc = /回/.test(kindTxt) ? "kx" : /特|通|Ｓ|S/.test(kindTxt) ? "kt" : /急|準|快|Ｆ|F/.test(kindTxt) ? "ke" : "kl";

							if (opTxt != "") { var pill = document.createElement("span"); pill.className = "op"; pill.textContent = opTxt; tra.appendChild(pill); }
							var ic = document.createElement("span");
							ic.className = "ic";
							ic.innerHTML = TRAIN_ICON_SVG;
							tra.appendChild(ic);
							var chipTxt = (kindTxt + " " + destTxt).trim();
							if (chipTxt != "") { var chip = document.createElement("span"); chip.className = "chip " + kc; chip.textContent = chipTxt; tra.appendChild(chip); }

							var origText = "";
							if ("num_of_cars" in o && o.num_of_cars != "" && o.num_of_cars != "99") origText += o.num_of_cars;
							if ("affiliation" in o && o.affiliation != "") origText += o.affiliation == null ? "？" : o.affiliation;
							var origTrainNum = ("train_orchestration_number" in o && o.train_orchestration_number != "") ? o.train_orchestration_number : "";

							var cachedElesite = (elesiteParams && hasOp) ? getElesiteCachedInfo(elesiteKey(elesiteParams), o.operation_number) : null;
							var elesiteSharyo = cachedElesite && cachedElesite.sharyo_list ? cachedElesite.sharyo_list : null;
							var match = cachedElesite && cachedElesite.match ? cachedElesite.match : null;

							var guessedFm = elesiteSharyo ? "" : guessFormation(o, tlid);
							var iconInfo = { formation: elesiteSharyo ? plain(elesiteSharyo).trim() : guessedFm, affiliation: (o.affiliation || ""), cars: parseInt(o.num_of_cars, 10), line: tlid, match: match };
							if (DBG) dbg("t" + opTxt, "列車 " + opTxt + " えれ情報:" + (cachedElesite ? "あり 形式='" + iconInfo.formation + "'" : "なし") + " 推定:" + (guessedFm || "-") + " 候補:" + elesiteIconUrls(iconInfo).length);

							var metaTxt = origText + origTrainNum;
							if (metaTxt.trim() != "") { var mt = document.createElement("span"); mt.className = elesiteSharyo ? "mt" : "fm"; mt.innerHTML = metaTxt; tra.appendChild(mt); }

							{
								var a = document.createElement("a");

								if (linedata[curline].hapi) { a.href = "#"; a.onclick = function (ev) { ev.preventDefault(); hapiOpenDrawer(o); }; } else
								a.href = "https://tokyu-tid.s3.amazonaws.com/train_schedules?lineId=" + o.line_id + "&operationNumber=" + o.operation_number + "&direction=" + (o.up == true ? "up" : "down");
								tra.appendChild(a);
							}

							var anchorId = null;
							if ("station_id" in o && o.station_id != null) anchorId = "sta" + o.station_id;
							if ("section_id" in o && o.section_id != null) anchorId = "sec" + o.section_id;
							var anchor = anchorId ? document.getElementById(anchorId) : null;
							if (anchor && anchor.parentNode)
							{
								var box = anchor.parentNode.querySelector(o.up ? ".hl" : ".hr");
								if (box) box.appendChild(tra);

					if (isHapiLine()) hapiFillTimes();

					if (contentElem) contentElem.innerHTML = (extraTrainsList.length > 0) ? extraTrainsList.join(", ") : "なし";

				var renderTrains = function() {
					try { renderTrainsInner(); }
					catch (e) { console.error("描画エラー:", e); }
					finally { request = null; }
				};

				var elesiteParams = elesite_rosen_map[curline];
				var needElesiteFetch = false;

				if (elesiteParams && res && Array.isArray(res.trains))
				{
					for (var i = 0; i < res.trains.length; i++)
					{
						var tr = res.trains[i];
						if (tr.line_id == linedata[curline].line_id && tr.operation_number != null && tr.operation_number !== "")
						{
							if (!getElesiteCachedInfo(elesiteKey(elesiteParams), tr.operation_number))
							{
								needElesiteFetch = true;
								break;
							}
						}
					}
				}

				var nowMs = Date.now();
				if (elesiteParams && needElesiteFetch && (nowMs - (lastElesiteFetchTimes[elesiteKey(elesiteParams)] || 0) > ELESITE_FETCH_COOLDOWN))
				{
					lastElesiteFetchTimes[elesiteKey(elesiteParams)] = nowMs;
					var now = new Date();
					if (now.getHours() < 2) {
						now.setDate(now.getDate() - 1);
					}
					var hh = ("0" + now.getHours()).slice(-2);
					var mm = ("0" + now.getMinutes()).slice(-2);
					var yyyy = now.getFullYear();
					var mo = ("0" + (now.getMonth() + 1)).slice(-2);
					var dd = ("0" + now.getDate()).slice(-2);
					var elesiteQuery = "get_train_position_split?rosen_code=" + elesiteParams.rosen_code + "&current_time=" + hh + ":" + mm + "&day_id=__DAYID__&select_date=" + yyyy + "-" + mo + "-" + dd + "&second=0&concat_mode=false&route_id=" + elesiteParams.route_id + "&show_signal_stations=false&show_unkyu_trains=false";

					var done = false;
					var finish = function () { if (done) return; done = true; renderTrains(); };
					var timer = setTimeout(function () { dbg("fetch", "えれ取得: 8秒で未応答"); finish(); }, 8000);
					getDayId(elesiteParams, yyyy + "-" + mo + "-" + dd).then(function (did) { return fetchElesite(elesiteQuery.replace("__DAYID__", did)); })
						.then(data => {
							try { if (data) setElesiteCacheFromData(elesiteKey(elesiteParams), data); } catch (e) { console.error(e); }
							if (DBG && data) { var tp = Array.isArray(data.train_position) ? data.train_position : []; dbg("data", "えれ応答 train_position:" + tp.length + "件 キー:" + (tp[0] ? Object.keys(tp[0]).join(",") : "-") + "\n例: " + "(sharyo_list有り" + tp.filter(function (x) { return x.sharyo_list; }).length + " / shotei有り" + tp.filter(function (x) { return x.shotei; }).length + ")\n先頭5件: " + JSON.stringify(tp.slice(0, 5).map(function (x) { return { u: x.unban, shubetsu: x.shubetsu, shotei: x.shotei, n: x.combination_num, ic: (x.sharyo_icon_path_list || [])[0] }; })) + "\n情報あり例: " + JSON.stringify(tp.filter(function (x) { return x.sharyo_list || x.shotei; }).slice(0, 3).map(function (x) { return { u: x.unban, s: x.sharyo_list, shotei: x.shotei, ic: x.sharyo_icon_path_list }; }))); }
							clearTimeout(timer); finish();
						})
						.catch(e => { dbg("fetch", "えれ取得: 通信エラー " + e); clearTimeout(timer); finish(); });
				}
				else
				{
					renderTrains();
				}
			};
			request.send(null);
		}

		function initRouteDrawer()
		{
			var container = document.getElementById("route-list-container");

			<svg viewBox="0 0 24 24"><path d="M6 17.59 7.41 19 12 14.42 16.59 19 18 17.59l-6-6z"></path><path d="m6 11 1.41 1.41L12 7.83l4.59 4.58L18 11l-6-6z"></path></svg>
		</button>
		<button onclick="window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})" title="下へスクロール">
			<svg viewBox="0 0 24 24"><path d="M18 6.41 16.59 5 12 9.58 7.41 5 6 6.41l6 6z"></path><path d="m18 13-1.41-1.41L12 16.17l-4.59-4.58L6 13l6 6z"></path></svg>
		</button>
		<button onclick="update()" title="再取得">
			<svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4z"></path></svg>
		</button>
	</div>

	<!-- ボトムナビゲーションバー（フッター） -->
	<footer class="app-footer">
		<div class="footer-inner">
			<div class="footer-item active" id="footer-btn-train" role="button" onclick="switchFooterTab('train')">
				<svg viewBox="0 0 384 512"><path d="M215.7 499.2C267 435 384 279.4 384 192C384 86 298 0 192 0S0 86 0 192c0 87.4 117 243 168.3 307.2c12.3 15.3 35.1 15.3 47.4 0zM192 128a64 64 0 1 1 0 128 64 64 0 1 1 0-128z"></path></svg>
				<span>列車位置</span>
				<div class="footer-indicator"></div>
			</div>
			<div class="footer-item" id="footer-btn-route" role="button" onclick="switchFooterTab('route')">
				<svg viewBox="0 0 512 512"><path d="M512 96c0 50.2-59.1 125.1-84.6 155c-3.8 4.4-9.4 6.1-14.5 5L320 256c-17.7 0-32 14.3-32 32s14.3 32 32 32l96 0c53 0 96 43 96 96s-43 96-96 96l-276.4 0c8.7-9.9 19.3-22.6 30-36.8c6.3-8.4 12.8-17.6 19-27.2L416 448c17.7 0 32-14.3 32-32s-14.3-32-32-32l-96 0c-53 0-96-43-96-96s43-96 96-96l39.8 0c-21-31.5-39.8-67.7-39.8-96c0-53 43-96 96-96s96 43 96 96zM117.1 489.1c-3.8 4.3-7.2 8.1-10.1 11.3l-1.8 2-.2-.2c-6 4.6-14.6 4-20-1.8C59.8 473 0 402.5 0 352c0-53 43-96 96-96s96 43 96 96c0 30-21.1 67-43.5 97.9c-10.7 14.7-21.7 28-30.8 38.5l-.6 .7zM128 352a32 32 0 1 0 -64 0 32 32 0 1 0 64 0zM416 128a32 32 0 1 0 0-64 32 32 0 1 0 0 64z"></path></svg>
				<span>路線選択</span>
				<div class="footer-indicator"></div>
			</div>
		</div>
	</footer>

	<!-- 路線選択 ドロワー / ボトムシート -->
	<div id="train-drawer-backdrop" class="drawer-backdrop" onclick="closeTrainDrawer()"></div>
	<div id="train-drawer" class="route-drawer">
		<div class="drawer-header">
			<span class="drawer-title" id="train-drawer-title"></span>
			<button class="drawer-close-btn" onclick="closeTrainDrawer()">閉じる</button>
		</div>
		<div class="drawer-content" id="train-drawer-content"></div>
	</div>

	<div id="route-drawer-backdrop" class="drawer-backdrop" onclick="closeRouteDrawer()"></div>
	<div id="route-drawer" class="route-drawer">
		<div class="drawer-header">
			<span class="drawer-title">路線を選ぶ</span>
			<button class="drawer-close-btn" onclick="closeRouteDrawer()">閉じる</button>
		</div>
		<div class="drawer-content" id="route-list-container">
			<!-- JavaScript で路線カードが自動挿入されます -->
		</div>
	</div>
</body>
</html>
